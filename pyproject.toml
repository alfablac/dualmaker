[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualmaker"
version = "0.9.5"
description = "Build correctly synchronized Portuguese dual-audio MKVs from matching releases"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "dualmaker contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "annoy>=1.17",
  "click>=8.1",
  "ffmpeg-python>=0.2",
  "librosa>=0.10",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pymediainfo>=6.1",
  "pysubs2>=1.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "textual>=0.58",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
dualmaker = "dualmaker.cli:main"
dualmaker-gui = "dualmaker.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dualmaker = ["samples/*", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/dualmaker/sync/milksync.py"]
